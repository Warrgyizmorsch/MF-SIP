# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.9.0


dependencies:
  flutter:
    sdk: flutter

 
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8
  loading_animation_widget: ^1.3.0

  #getx 
  get: ^4.7.3

  #responsive ui
  flutter_screenutil: ^5.9.3
  pinput: ^6.0.1
  fl_chart: ^1.1.1
  # fl_chart: ^0.70.0
  flutter_svg: ^2.2.3
  easy_stepper: ^0.9.1
  readmore: ^3.0.0
  syncfusion_flutter_gauges: ^32.1.21
  gap: ^3.0.1
  package_info_plus: ^9.0.0 # package info
  mime: ^2.0.0 # post form image upload Unit8
  dio: ^5.9.0 # api calls
  flutter_secure_storage: ^9.2.4 # local storage
  shared_preferences: ^2.5.4
  responsive_framework: ^1.5.1
  dartz: ^0.10.1   # data sources, repositories & useCases
  equatable: ^2.0.7
  intl: ^0.20.2
  percent_indicator: ^4.2.5
  dotted_border: ^3.1.0
  cached_network_image: ^3.4.1
  video_player: ^2.10.1
  smooth_page_indicator: ^2.0.1
  animated_text_kit: ^4.3.0
  shimmer: ^3.0.0

  webview_flutter: ^4.10.0 # webview
  html_unescape: ^2.0.0 # webview
  youtube_player_flutter: ^9.1.1
  youtube_player_iframe: ^5.2.2
  image_picker: ^1.2.1
  permission_handler: ^12.0.1
  device_info_plus: ^12.3.0
  in_app_review: ^2.0.11
  local_auth: ^3.0.0

  path_provider: ^2.1.5
  file_saver: ^0.3.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  universal_html: ^2.3.0
 







dev_dependencies:
  flutter_test:
    sdk: flutter

 
  flutter_lints: ^5.0.0


flutter:

 
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/logo/
    - assets/icon/
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          # weight: 400
        - asset: assets/fonts/Geist-Black.ttf
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geist-ExtraBold.ttf
        - asset: assets/fonts/Geist-ExtraLight.ttf
        - asset: assets/fonts/Geist-Light.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
        - asset: assets/fonts/Geist-Thin.ttf
          style: italic
